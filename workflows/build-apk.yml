name: Build VIIDU APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            python3-dev \
            libgl1-mesa-dev \
            zlib1g-dev \
            libjpeg-dev \
            libfreetype6-dev \
            libffi-dev \
            libssl-dev \
            pkg-config \
            openjdk-11-jdk \
            unzip \
            zip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython buildozer kivy psutil cpuinfo

      - name: Build APK
        run: |
          ls -la
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: viidu-apk
          path: |
            bin/*.apk
